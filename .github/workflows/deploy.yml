name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (see README)."
            exit 1
          fi

      - name: Create the D1 database on first deploy
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="attendance");if(d)console.log(d.uuid)')
          if [ -z "$id" ]; then
            npx wrangler d1 create attendance
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(x=>x.name==="attendance").uuid)')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        env:
          LECTURER_PASSCODE: ${{ secrets.LECTURER_PASSCODE }}
        run: |
          if [ -n "$LECTURER_PASSCODE" ]; then
            umask 077
            printf 'LECTURER_PASSCODE=%s\n' "$LECTURER_PASSCODE" > "$RUNNER_TEMP/secrets.env"
            npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.env"
            rm -f "$RUNNER_TEMP/secrets.env"
          else
            npx wrangler deploy
          fi
