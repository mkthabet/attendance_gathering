<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance sheet</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <p><a href="/">← All sheets</a></p>
  <div class="card">
    <form id="rename-form" class="row">
      <input id="name" class="grow" type="text" maxlength="120" required aria-label="Sheet name">
      <button type="submit">Rename</button>
    </form>
    <p class="muted" id="meta"></p>
    <div class="row">
      <button id="present" class="primary" type="button">Start and show QR</button>
      <button id="toggle" type="button"></button>
      <a id="csv" class="button" href="#">Download CSV</a>
    </div>
    <p id="error" class="error"></p>
  </div>
  <div class="card">
    <h2>Add a student manually</h2>
    <form id="add-form">
      <div class="row">
        <input id="add-name" class="grow" type="text" maxlength="100" required placeholder="Name" aria-label="Student name">
        <input id="add-sid" class="grow" type="text" maxlength="40" required placeholder="Student ID" aria-label="Student ID">
      </div>
      <textarea id="add-notes" rows="2" maxlength="1000" placeholder="Notes (optional)" aria-label="Notes"></textarea>
      <div class="row">
        <button type="submit">Add to sheet</button>
        <span id="add-msg" class="success"></span>
      </div>
      <p id="add-error" class="error"></p>
    </form>
  </div>
  <div class="card">
    <h2 id="count"></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Student ID</th><th>Time</th><th>Notes</th><th>Flags</th><th></th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <button id="delete" class="danger" type="button">Delete this sheet</button>
  </div>
</main>
<script src="/app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id");
let sheet;

function show(e) { $("error").textContent = e.message; }

function notesBox(r) {
  const box = el("textarea", { class: "notes", rows: 1, maxlength: 1000, placeholder: "Add a note", "aria-label": "Notes for " + r.name });
  box.value = r.notes;
  box.rows = Math.min(4, r.notes.split("\n").length);
  let saved = r.notes;
  box.addEventListener("change", async () => {
    try {
      const res = await api("/api/admin/sheets/" + id + "/records/" + r.id, { method: "PATCH", body: { notes: box.value } });
      saved = res.notes;
      box.classList.remove("unsaved");
    } catch (err) { box.classList.add("unsaved"); show(err); }
  });
  box.addEventListener("input", () => box.classList.toggle("unsaved", box.value !== saved));
  return box;
}

// Don't redraw the table under the lecturer while they are typing.
function isEditing() {
  const a = document.activeElement;
  return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && a.id !== "name";
}

async function load() {
  const data = await api("/api/admin/sheets/" + id);
  sheet = data.sheet;
  document.title = sheet.name;
  if (document.activeElement !== $("name")) $("name").value = sheet.name;
  $("meta").textContent = "Created " + fmtDate(sheet.createdAt) + " · " + (sheet.status === "open" ? "Open for check-in" : "Closed");
  $("toggle").textContent = sheet.status === "open" ? "Stop check-in" : "Reopen check-in";
  $("toggle").classList.toggle("hidden", sheet.status !== "open" && !sheet.openedAt);
  $("csv").href = "/api/admin/sheets/" + id + "/export.csv?tz=" + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone);
  $("count").textContent = data.records.length + " checked in";
  const body = $("records");
  body.replaceChildren();
  data.records.forEach((r, i) => body.append(el("tr", {},
    el("td", {}, i + 1), el("td", {}, r.name), el("td", {}, r.studentId), el("td", {}, fmtTime(r.createdAt)),
    el("td", {}, notesBox(r)),
    el("td", {}, r.manual ? el("span", { class: "pill" }, "Added manually") : "", el("span", { class: "flag" }, r.flags)),
    el("td", {}, el("button", { type: "button", class: "danger", title: "Remove this check-in", onclick: async () => {
      if (!confirm("Remove " + r.name + " (" + r.studentId + ") from this sheet?")) return;
      await api("/api/admin/sheets/" + id + "/records/" + r.id, { method: "DELETE" }).catch(show);
      load();
    } }, "Remove")))));
}

$("rename-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { await api("/api/admin/sheets/" + id, { method: "PATCH", body: { name: $("name").value } }); $("name").blur(); load(); }
  catch (err) { show(err); }
});
$("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("add-error").textContent = "";
  $("add-msg").textContent = "";
  try {
    await api("/api/admin/sheets/" + id + "/records", {
      method: "POST",
      body: { name: $("add-name").value, studentId: $("add-sid").value, notes: $("add-notes").value },
    });
    $("add-msg").textContent = "Added " + $("add-name").value.trim() + ".";
    $("add-form").reset();
    $("add-name").focus();
    load().catch(show);
  } catch (err) { $("add-error").textContent = err.message; }
});
$("present").addEventListener("click", () => { location.href = "/present?id=" + id; });
$("toggle").addEventListener("click", async () => {
  try { await api("/api/admin/sheets/" + id + "/" + (sheet.status === "open" ? "close" : "open"), { method: "POST" }); load(); }
  catch (err) { show(err); }
});
$("delete").addEventListener("click", async () => {
  if (!confirm("Delete \"" + sheet.name + "\" and all its check-ins? This cannot be undone.")) return;
  try { await api("/api/admin/sheets/" + id, { method: "DELETE" }); location.href = "/"; } catch (err) { show(err); }
});

load().catch(show);
setInterval(() => { if (sheet && sheet.status === "open" && !isEditing()) load().catch(() => {}); }, 5000);
</script>
</body>
</html>
